# sensor.yaml
api_version: sensor/v0.1
name: port-process-capture
version: 1.0.0
description: >
  Finds the process listening on a given TCP port and continuously
  transcribes its stdout and/or stderr into an observable file artifact.

runtime:
  entrypoint: runner.py
  language: python

# --- Source ---
# type: process.port  (extended type: resolves port → PID → fd capture)
source:
  type: process.port
  target: 8080                  # TCP port to watch — override per-invocation
  config:
    streams: [stdout, stderr]   # which streams to capture
    poll_interval: 250ms        # how often to poll when waiting or tailing

# --- Sink ---
sink:
  type: file.ring
  target: ./port-capture.log    # override to any writable path
  config:
    max_lines: 2000
    flush_interval: 500ms
    format: text

# --- Lifecycle ---
lifecycle:
  trigger: manual
  teardown: on_process_exit     # sensor stops when the observed process exits

# --- Agent Hints ---
agent_hints:
  observe_strategy: >
    This artifact is a fixed-size ring buffer (newest lines kept, oldest evicted)
    continuously updated from the stdout/stderr of the process that is listening
    on the configured port. Use native read or search tools to inspect recent
    output. Re-read when staleness matters — the file is rewritten every
    flush_interval.
  query_examples:
    - "Read the last 100 lines to see recent output"
    - "Search for 'ERROR' or 'Exception' in the capture file"
    - "Check if the server has finished starting up"
  freshness_sla: "1s"
